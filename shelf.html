<!DOCTYPE html>

<body class="page-shelf">

        <img class="wordmark-mark" src="./img/avatar.svg" width="32" height="32" alt="">
        <span>njoh iphone</span>
      </a>
      <nav aria-label="Primary">
        <ul class="nav-links">
          <li><a href="./shelf.html" data-i18n="navShelf">shelf</a></li>

          <li><a href="./#delivery" data-i18n="navDelivery">delivery</a></li>

      </nav>
      <div class="nav-end">
        <div class="lang-switch" role="group" data-i18n-aria="langLabel" aria-label="Language">
          <button type="button" class="lang-btn" data-lang="en" aria-pressed="true">EN</button>
          <button type="button" class="lang-btn" data-lang="fr" aria-pressed="false">FR</button>

    </section>

  <div class="sticky-buy" role="region" data-i18n-aria="stickyLabel" aria-label="Order on WhatsApp">

      <div class="sticky-copy">
        <strong data-i18n="stickyReady">ready to order</strong>

      </div>
      <a class="btn btn--accent" href="https://wa.me/237600000000" data-wa-intent="sticky" data-i18n="stickyCta">Order on WhatsApp</a>
